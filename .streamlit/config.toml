# Tema visual de FinAseo: verde claro con letra negra para facilitar la lectura.

[theme]
base = "light"
primaryColor = "#16A34A"                 # verde: botones, selección, acentos
backgroundColor = "#FAFCFA"              # fondo general casi blanco
secondaryBackgroundColor = "#EAF5EC"     # fondo de casillas y tablas
textColor = "#111111"                    # letra negra
borderColor = "#CFE5D4"
linkColor = "#15803D"
baseRadius = "0.5rem"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#D6EEDB"
dataframeHeaderTextColor = "#111111"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Playfair Display':https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap"
chartCategoricalColors = ["#16A34A", "#0F766E", "#EA8C2F", "#9CA3AF", "#4ADE80"]

[theme.sidebar]
backgroundColor = "#E6F4E9"              # barra lateral verde claro
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111111"
primaryColor = "#15803D"
borderColor = "#CFE5D4"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Playfair Display':https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap"
